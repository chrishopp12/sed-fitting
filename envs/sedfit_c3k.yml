# Merged fitting env, C3K FSPS build. Identical to sedfit_miles.yml except
# the compiled FSPS library: after creating the env, rebuild python-fsps
# with the C3K flags (see README "C3K spectral library"):
#   FFLAGS="-DMILES=0 -DC3K=1" pip install --force-reinstall \
#       --no-cache-dir --no-binary fsps fsps==0.4.7
# Runtime requires $SPS_HOME (the fsps checkout).
name: sedfit_c3k
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.0
  - scipy=1.16
  - astropy=7.1
  - matplotlib=3.10
  - pandas=2.3
  - h5py=3.14
  - pytest
  - pip
  - pip:
      - astro-prospector==1.4.1
      - astro-sedpy==0.4.1
      - fsps==0.4.7
      - dynesty==2.1.5
      - emcee==3.1.6
      - corner==2.2.3
      - eazy==0.8.6
